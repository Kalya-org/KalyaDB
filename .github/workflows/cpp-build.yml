name: KalyaDB C++ Build

on:
  push:
    branches: [main]
    paths:
      - "engine/cpp/**"
      - ".github/workflows/cpp-build.yml"
  pull_request:
    paths:
      - "engine/cpp/**"
      - ".github/workflows/cpp-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S engine/cpp/native -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
